<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lesson Page</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light py-5">

<div class="container mt-5">
    <div class="mb-4 d-flex flex-row justify-content-between">
        <h2 class="fw-bold text-dark"><span class="bi bi-journal-text text-primary me-2"></span>List lessons</h2>
        <button type="button" data-bs-toggle="modal" data-bs-target="#createLessonModal" class="btn btn-primary">Create
            lesson
        </button>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        <div class="col" th:each="lesson: ${lessonDtoList}">
            <div class="card h-100 shadow-sm border-0 position-relative overflow-hidden">
                <div class="card-body d-flex flex-column p-4">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                                <span class="badge bg-primary bg-opacity-10 text-primary mb-2 px-2 py-1 fw-semibold">
                                    <span class="bi bi-clock me-1"></span> Pair № <span
                                        th:text="${lesson.pairNumber}">1</span>
                                </span>
                            <h4 class="card-title fw-bold text-dark mb-1" th:text="${lesson.subject.name}">Name
                                Subject</h4>
                        </div>
                        <span class="text-muted small">ID: <span th:text="${lesson.id}">1</span></span>
                    </div>

                    <div class="d-flex align-items-center mb-3 text-secondary">
                        <i class="bi bi-person-badge fs-5 me-2 text-primary"></i>
                        <span class="fw-medium" th:text="${lesson.professor.fullName}">Name Professor</span>
                    </div>
                    <hr class="text-muted opacity-25 my-2">
                    <div class="row mt-auto pt-2 g-2">
                        <div class="col-6">
                            <div class="p-2 bg-light rounded-3 d-flex align-items-center">
                                <span class="bi bi-door-open text-muted fs-5 me-2"></span>
                                <div>
                                    <small class="d-block text-muted" style="font-size: 0.75rem;">Classroom</small>
                                    <span class="fw-semibold text-dark" th:text="${lesson.classroom}">101-А</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-2 bg-light rounded-3 d-flex align-items-center">
                                <span class="bi bi-people text-muted fs-5 me-2"></span>
                                <div>
                                    <small class="d-block text-muted" style="font-size: 0.75rem;">Students</small>
                                    <span class="fw-semibold text-dark" th:text="${lesson.quantityStudents}">25</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer d-flex flex-row p-4 gap-1">
                    <button type="button"
                            class="btn btn-danger"
                            data-bs-toggle="modal"
                            data-bs-target="#confirmModal"
                            th:data-id="${lesson.id}">
                        Delete
                    </button>
                    <button type="button"
                            data-bs-toggle="modal"
                            data-bs-target="#updateLessonModal"
                            onclick="fetchEditLesson(this)"
                            th:attr="data-id=${lesson.id}"
                            class="btn btn-primary">Update
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="createLessonModal"
     tabindex="-1"
     role="dialog"
     aria-labelledby="createLessonModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createLessonModalLabel">Create Lesson</h5>
            </div>
            <div class="modal-body">
                <form id="form-create-lesson"
                      class="col"
                      th:action="@{/lesson/save}"
                      th:object="${lesson}"
                      method="post">
                    <label for="timeEvent">Time Event:</label>
                    <input type="text"
                           id="timeEvent"
                           class="form-control"
                           th:field="*{timeEvent}"
                    />

                    <label for="classRoom">Classroom:</label>
                    <input type="text"
                           id="classRoom"
                           class="form-control"
                           th:field="*{classroom}"
                    />

                    <label for="quantityStudents">Quantity Students:</label>
                    <input type="number"
                           id="quantityStudents"
                           class="form-control"
                           th:field="*{quantityStudents}"
                    />

                    <label for="pairNumber">Pair Number:</label>
                    <input type="number"
                           id="pairNumber"
                           class="form-control"
                           th:field="*{pairNumber}"
                    />

                    <label for="professors">Professor:</label>
                    <select id="professors"
                            class="form-select"
                            th:field="*{professor.id}">
                        <option th:each="professor: ${professorDtoList}"
                                th:value="${professor.id}"
                                th:text="${professor.fullName}"/>
                    </select>

                    <label for="subjects">Subject:</label>
                    <select id="subjects"
                            class="form-select"
                            th:field="*{subject.id}">
                        <option th:each="subject: ${subjectDtoList}"
                                th:value="${subject.id}"
                                th:text="${subject.name}"/>
                    </select>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button form="form-create-lesson" type="submit" class="btn btn-primary">Create lesson</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="updateLessonModal"
     tabindex="-1"
     role="dialog"
     aria-labelledby="updateLessonModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="updateLessonModalLabel">Update Lesson</h5>
            </div>
            <div class="modal-body">
                <form id="form-update-lesson"
                      class="col"
                      th:action="@{/lesson/save}"
                      th:object="${lessonEdit}"
                      method="post">

                    <label for="lessonIdUpdate">Lesson ID:</label>
                    <input type="text"
                           id="lessonIdUpdate"
                           class="form-control"
                           th:field="*{id}"
                           readonly
                    />

                    <label for="timeEventUpdate">Time Event:</label>
                    <input type="text"
                           id="timeEventUpdate"
                           class="form-control"
                           th:field="*{timeEvent}"
                    />

                    <label for="classRoomUpdate">Classroom:</label>
                    <input type="text"
                           id="classRoomUpdate"
                           class="form-control"
                           th:field="*{classroom}"
                    />

                    <label for="quantityStudentsUpdate">Quantity Students:</label>
                    <input type="number"
                           id="quantityStudentsUpdate"
                           class="form-control"
                           th:field="*{quantityStudents}"
                    />

                    <label for="pairNumberUpdate">Pair Number:</label>
                    <input type="number"
                           id="pairNumberUpdate"
                           class="form-control"
                           th:field="*{pairNumber}"
                    />

                    <label for="professorsUpdate">Professor:</label>
                    <select id="professorsUpdate"
                            class="form-select"
                            th:field="*{professor.id}">
                        <option th:each="professor: ${professorDtoList}"
                                th:value="${professor.id}"
                                th:text="${professor.fullName}"/>
                    </select>

                    <label for="subjectsUpdate">Subject:</label>
                    <select id="subjectsUpdate"
                            class="form-select"
                            th:field="*{subject.id}">
                        <option th:each="subject: ${subjectDtoList}"
                                th:value="${subject.id}"
                                th:text="${subject.name}"/>
                    </select>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button form="form-update-lesson" type="submit" class="btn btn-primary">Update lesson</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="confirmModalLabel">Confirm Delete</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="form-delete-lesson" method="post">
                    <p>Are you sure you want to delete this lesson with ID: <span id="spn-delete-id"></span>?</p>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" form="form-delete-lesson" class="btn btn-danger">Delete lesson</button>
            </div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.2.3/js/bootstrap.bundle.min.js"></script>
<script>

    const fetchEditLesson = async (button) => {
        const id = button.dataset.id;

        const response = await fetch(`/lesson/${id}`);

        if (!response.ok) {
            console.error("Failed to load lesson:", response.status);
            return;
        }

        const editLesson = await response.json();

        document.getElementById('lessonIdUpdate').value = editLesson.id;
        document.getElementById('timeEventUpdate').value = editLesson.timeEvent;
        document.getElementById('classRoomUpdate').value = editLesson.classroom;
        document.getElementById('quantityStudentsUpdate').value = editLesson.quantityStudents;
        document.getElementById('pairNumberUpdate').value = editLesson.pairNumber;
        document.getElementById('professorsUpdate').value = editLesson.professor.id;
        document.getElementById('subjectsUpdate').value = editLesson.subject.id;
    };

    document.getElementById('confirmModal').addEventListener('show.bs.modal', (event) => {
        const id = event.relatedTarget.getAttribute('data-id');

        document.getElementById('spn-delete-id').textContent = id;
        document.getElementById('form-delete-lesson').action = `/lesson/delete/${id}`;
    });

</script>
</body>
</html>
